[project]
name = "fastai-starter"
version = "0.1.0"
description = "FastAI Starter Repository for backend developers."
readme = "README.md"
requires-python = "==3.13.*"
dependencies = [
    "aioboto3>=15.5.0",
    "aiohttp>=3.14.5",
    "black>=26.10.1",
    "editorconfig-checker==3.2.1",
    "fastapi[standard]==0.115.12",
    "furl>=2.1.4",
    "html-page-generator",
    "isort>=9.0.2",
    "pre-commit>=4.3.0",
    "pydantic-settings>=2.16.3",
    "ruff==0.11.13",
]

[tool.uv.sources]
html-page-generator = { git = "https://github.com/devmanorg/html-page-generator.git" }
